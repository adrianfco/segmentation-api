services:
  api:
    build: .
    image: segmentation-api:local
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"

  worker:
    build: .
    image: segmentation-api:local
    env_file: .env
    command: ["python", "-m", "app.worker"]
    environment:
      OMP_NUM_THREADS: "1"
    restart: unless-stopped
